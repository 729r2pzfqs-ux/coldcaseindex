# Rebuilds the site once a day so /today/ follows the calendar and the
# "cases to watch" page flags dates that have passed. Only commits when the
# generated output actually changed. Pull before pushing local work: this
# workflow commits to main.
name: Daily rebuild

on:
  schedule:
    - cron: '20 6 * * *'   # 06:20 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build reads first-published dates from git history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 scripts/build.py

      - name: Check
        run: python3 scripts/check.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily rebuild for $(date -u +%Y-%m-%d)"
          git push
